plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'space.vestiges'
version = '1.0-SNAPSHOT'

def mythicVersion = '5.9.5'
def mythicJar = file("libs/MythicMobs-${mythicVersion}.jar")

// Fail the build if the jar isn't present
if (!mythicJar.exists()) {
    throw new GradleException("Missing MythicMobs jar: ${mythicJar}. " +
            "Download MythicMobs ${mythicVersion} and place it in the libs/ folder.")
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven {
        name = "ProtocolLib"
        url "https://repo.dmulloy2.net/repository/public/"
    }
    flatDir {
        dirs 'libs'
    }

}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT")
    compileOnly "net.dmulloy2:ProtocolLib:5.4.0"
    compileOnly(files("libs/MythicMobs-${mythicVersion}.jar"))
    implementation("de.tr7zw:item-nbt-api-plugin:2.15.2")
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

jar {
    //sorcery (where to put the jar after it's built) TODO change this later
    destinationDirectory = file("A:/minecraft_plugin_devserver/plugins")
    archiveFileName = 'Plugin1.jar'
}
